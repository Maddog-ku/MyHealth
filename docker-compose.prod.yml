services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${MYHEALTH_ENV_FILE:-.env.prod}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myhealth}
      POSTGRES_USER: ${POSTGRES_USER:-myhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: myhealth-backend:prod
    restart: unless-stopped
    env_file:
      - ${MYHEALTH_ENV_FILE:-.env.prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/myhealth}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-myhealth}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env.prod}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
    volumes:
      - backend-prod-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    image: myhealth-frontend:prod
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-prod-data:
  redis-prod-data:
  backend-prod-uploads:
