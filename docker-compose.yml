services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myhealth
      POSTGRES_USER: myhealth
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"   # 避開本機既有 Postgres（brew 安裝會佔 5432）
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhealth -d myhealth"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles: ["ai"]   # 預設不啟動；用 `docker compose --profile ai up -d` 才會拉模型

volumes:
  postgres-data:
  ollama-data:
