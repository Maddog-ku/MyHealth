<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>離線 · MyHealth</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
        background: #fafafc;
        color: #1e293b;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #070b13; color: #e2e8f0; }
        .card { background: rgba(15, 23, 42, 0.5); border-color: rgba(30, 41, 59, 0.6); }
        .sub { color: #94a3b8; }
      }
      .card {
        max-width: 22rem;
        margin: 1.5rem;
        padding: 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 1.5rem;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.15);
      }
      .logo { width: 56px; height: 56px; margin: 0 auto 1rem; }
      h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
      .sub { font-size: 0.85rem; line-height: 1.6; color: #64748b; margin: 0 0 1.5rem; }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        padding: 0.7rem 1.4rem;
        border-radius: 1rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(to right, #059669, #14b8a6);
        box-shadow: 0 8px 20px -8px rgba(16, 185, 129, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo.svg" alt="MyHealth" />
      <h1>目前無法連線 📡</h1>
      <p class="sub">你現在處於離線狀態，MyHealth 需要網路才能載入最新的運動與飲食資料。請確認連線後再試一次。</p>
      <button onclick="location.reload()">重新連線</button>
    </div>
  </body>
</html>
