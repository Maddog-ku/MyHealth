server:
  port: 8080

spring:
  application:
    name: myhealth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/myhealth}
    username: ${SPRING_DATASOURCE_USERNAME:myhealth}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-base64-or-long-random-secret-at-least-32-bytes}
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:local}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    text-model: ${OLLAMA_TEXT_MODEL:gemma4:e4b}
    vision-model: ${OLLAMA_VISION_MODEL:gemma4:e4b}
    idle-timeout-sec: ${AI_IDLE_TIMEOUT_SEC:60}
  upload-dir: ${UPLOAD_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.myhealth.ai: DEBUG
