server:
  port: 8080

spring:
  application:
    name: myhealth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/myhealth}
    username: ${SPRING_DATASOURCE_USERNAME:myhealth}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    hikari:
      # 讓 DB 不可用時請求快速失敗（~5s），而非預設 30s——避免 Tomcat 執行緒被卡滿
      # 導致整個服務無回應（先前 Postgres 一掛掉就「整個系統崩潰」的主因）。
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      keepalive-time: 30000
      max-lifetime: 600000
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-base64-or-long-random-secret-at-least-32-bytes}
    access-ttl-min: ${JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:local}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    text-model: ${OLLAMA_TEXT_MODEL:gemma4:e4b}
    vision-model: ${OLLAMA_VISION_MODEL:gemma4:e4b}
    idle-timeout-sec: ${AI_IDLE_TIMEOUT_SEC:60}
  rate-limit:
    backend: ${RATE_LIMIT_BACKEND:memory}
    register-limit: ${RATE_LIMIT_REGISTER_LIMIT:5}
    login-limit: ${RATE_LIMIT_LOGIN_LIMIT:10}
    refresh-limit: ${RATE_LIMIT_REFRESH_LIMIT:30}
    ai-limit: ${RATE_LIMIT_AI_LIMIT:20}
    window: ${RATE_LIMIT_WINDOW:1m}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
    redis:
      uri: ${REDIS_URL:redis://localhost:6379}
      key-prefix: ${RATE_LIMIT_REDIS_KEY_PREFIX:myhealth:rate-limit}
      fail-open: ${RATE_LIMIT_REDIS_FAIL_OPEN:false}
      request-timeout: ${RATE_LIMIT_REDIS_REQUEST_TIMEOUT:2s}
      ttl-padding: ${RATE_LIMIT_REDIS_TTL_PADDING:10s}
  upload-dir: ${UPLOAD_DIR:./uploads}

management:
  endpoints:
    web:
      exposure:
        include: health   # 只開 health，其餘 actuator 端點維持關閉
  endpoint:
    health:
      # 匿名只看到 {"status":"UP"}（dev.sh / docker healthcheck 需要的就這個）；
      # 登入後才看得到 db、diskSpace 等元件明細，避免在 prod 洩漏基礎設施資訊。
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true   # 額外提供 /actuator/health/liveness 與 /readiness

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.myhealth.ai: DEBUG
